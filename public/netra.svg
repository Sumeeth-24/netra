<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="netraGradient" x1="32" y1="32" x2="224" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <radialGradient id="irisGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Eye -->
  <path
    d="M32 128C58 82 98 56 128 56C158 56 198 82 224 128C198 174 158 200 128 200C98 200 58 174 32 128Z"
    stroke="url(#netraGradient)"
    stroke-width="14"
    fill="none"
  />

  <!-- Iris -->
  <circle
    cx="128"
    cy="128"
    r="34"
    fill="url(#irisGradient)"
    filter="url(#glow)"
  />

  <!-- Pupil -->
  <circle
    cx="128"
    cy="128"
    r="12"
    fill="#0F172A"
  />

  <!-- Spark -->
  <path
    d="M128 86V74M128 182V170M170 128H182M74 128H86"
    stroke="#E0E7FF"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>